# ──────────────────────────────────────────
# application-local.yml
# ──────────────────────────────────────────
spring:
    config:
        activate:
            on-profile: local

    jpa:
        hibernate:
            ddl-auto: create-drop
        properties:
            hibernate:
                show_sql: true

    kafka:
        bootstrap-servers: localhost:9092

management:
    tracing:
        sampling:
            probability: 1.0

logging:
    level:
        com.firstticket: DEBUG
        org.hibernate.SQL: DEBUG
        org.hibernate.orm.jdbc.bind: TRACE
